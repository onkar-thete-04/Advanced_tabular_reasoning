[project]
name = "tablegpt-r1"
version = "0.1.0"
description = "Paper-faithful reproduction of TableGPT-R1 (arXiv:2512.20312): tabular reasoning via reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "datasketch>=1.6.0",
    "rouge-score>=0.1.2",
    "jsonschema>=4.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
train = [
    "transformers>=4.44.0",
    "datasets>=2.19.0",
    "accelerate>=0.33.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "trl>=0.9.0",
]
dev = ["pytest>=8.0.0"]

[project.scripts]
tablegpt-r1 = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
